name: Finalize Chapter 7 historical bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-ch7.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Insert classic recursive self-improvement bridge
        env:
          SECTION_B64: 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('chapters/07-recursive-self-improvement.md')
          text = p.read_text()
          marker = '## The Learner Edits the School\n'
          section = base64.b64decode(os.environ['SECTION_B64']).decode()
          if '## The Old Dream of the Machine That Improves Itself' not in text:
              if marker not in text:
                  raise SystemExit('marker not found')
              text = text.replace(marker, section + marker, 1)
          stop = 'code that uses a model can rewrite code that determines **how the model is used**.'
          if stop in text and '[STOP](https://arxiv.org/abs/2310.02304)' not in text:
              text = text.replace(stop, stop + ' ([STOP](https://arxiv.org/abs/2310.02304))', 1)
          p.write_text(text)
          PY

      - name: Commit final Chapter 7 and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/finalize-ch7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/07-recursive-self-improvement.md .github/workflows/finalize-ch7.yml
          git commit -m "Complete Chapter 7 historical self-improvement arc"
          git push
