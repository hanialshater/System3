name: Develop Chapter 7 historical arc

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/develop-ch7-history.yml'

permissions:
  contents: write

jobs:
  develop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Recover and run developmental edit
        shell: bash
        run: |
          git show HEAD^:.github/workflows/develop-ch7-history.yml > /tmp/old-workflow.yml
          python - <<'PY'
          from pathlib import Path
          s = Path('/tmp/old-workflow.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = s.index(start_marker) + len(start_marker)
          end = s.index(end_marker, start)
          code = s[start:end]
          lines = []
          for line in code.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/develop_ch7.py').write_text('\n'.join(lines) + '\n')
          PY
          python /tmp/develop_ch7.py

      - name: Commit developmental pass and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/develop-ch7-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/07-recursive-self-improvement.md .github/workflows/develop-ch7-history.yml
          git commit -m "Deepen Chapter 7 historical self-improvement arc"
          git push
