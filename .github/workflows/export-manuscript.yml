name: Export manuscript source

on:
  push:
    branches:
      - tmp/pdf-export-20260821

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package manuscript sources
        uses: actions/upload-artifact@v4
        with:
          name: system3-manuscript-source
          path: |
            README.md
            chapters/*.md
          if-no-files-found: error
          retention-days: 1
