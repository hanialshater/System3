name: Build curated book PDF (manual)

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the cached proof is current
        type: boolean
        default: false
      strict_art:
        description: Fail if existing artwork anchors or covers need review
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: curated-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: book-design/requirements-pdf.txt
      - name: Install PDF tools
        run: python -m pip install -r book-design/requirements-pdf.txt
      - name: Restore previous proof
        uses: actions/cache@v4
        with:
          path: output/pdf
          key: curated-pdf-v1-${{ runner.os }}-${{ hashFiles('chapters/*.md', 'book-design/pdf.py', 'book-design/requirements-pdf.txt', 'book-design/curated/**') }}
          restore-keys: curated-pdf-v1-${{ runner.os }}-
      - name: Test build safeguards
        run: python -m unittest discover -s book-design/curated/tests -v
      - name: Build only when needed
        env:
          FORCE_BUILD: ${{ inputs.force }}
          STRICT_ART: ${{ inputs.strict_art }}
        run: |
          args=(build --preview)
          if [[ "$FORCE_BUILD" == "true" ]]; then args+=(--force); fi
          if [[ "$STRICT_ART" == "true" ]]; then args+=(--strict-art); fi
          python book-design/pdf.py "${args[@]}"
      - name: Upload reading proof and review report
        uses: actions/upload-artifact@v4
        with:
          name: system3-curated-6x9
          path: |
            output/pdf/System3_Curated_6x9.pdf
            output/pdf/build-report.json
            output/pdf/previews/
          if-no-files-found: error
          retention-days: 30
