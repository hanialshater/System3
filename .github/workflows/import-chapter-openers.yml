name: Import chapter opener images

on:
  push:
    branches: [main]
    paths:
      - 'assets-upload/READY'

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and unpack chapter opener images
        shell: bash
        run: |
          cat assets-upload/chunks/part-* | base64 --decode > /tmp/chapter-openers.zip
          mkdir -p resources/chapter-openers
          unzip -o /tmp/chapter-openers.zip -d resources/chapter-openers
          rm -rf assets-upload

      - name: Commit individual image files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A resources/chapter-openers assets-upload
          git rm --ignore-unmatch .github/workflows/import-chapter-openers.yml
          git commit -m "Add draft book cover and chapter opener artwork"
          git push
