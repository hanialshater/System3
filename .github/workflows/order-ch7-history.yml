name: Order Chapter 7 chronology

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/order-ch7-history.yml'

permissions:
  contents: write

jobs:
  order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reorder historical sections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('chapters/07-recursive-self-improvement.md')
          text = p.read_text()

          def pull(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + text[b:], text[a:b].rstrip()

          text, novelty = pull(
              text,
              '## 2011: When the Objective Becomes the Trap',
              '## 2019–2021: The World Starts Generating the Curriculum'
          )

          text, old = pull(
              text,
              '## Meanwhile: The Old Dream of Recursive Improvement',
              '## 2023–2026: The Learner Edits the School'
          )
          old = old.replace(
              '## Meanwhile: The Old Dream of Recursive Improvement',
              '## 2003: The Old Dream Becomes a Design', 1
          )
          old = old.replace(
              'The reinforcement-learning story was not the only route toward self-improvement.\n\nA parallel tradition took the recursion literally.',
              'The reinforcement-learning story was not the only route toward self-improvement. A parallel tradition had taken the recursion literally decades earlier, and by 2003 it had become a concrete design problem.', 1
          )

          marker = '## 2016–2017: Learning to Learn'
          i = text.index(marker)
          text = text[:i] + old + '\n\n' + novelty + '\n\n' + text[i:]

          text = text.replace(
              '## 1989 and After: A Learner With a Past',
              '## A Parallel Problem Since 1989: A Learner With a Past', 1
          )
          text = text.replace(
              '## 1990–2017: The Opponent Does Not Let You Stop',
              '## A Parallel Pressure, 1973–2017: The Opponent Does Not Let You Stop', 1
          )

          p.write_text(text)
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          rm .github/workflows/order-ch7-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chapters/07-recursive-self-improvement.md .github/workflows/order-ch7-history.yml
          git commit -m "Clarify Chapter 7 historical chronology"
          git push
